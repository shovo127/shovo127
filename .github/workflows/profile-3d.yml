name: Re-render self-hosted 3D profile scenes

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-content-build
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install checksum-verified Blender and GIF encoder
        run: |
          set -euo pipefail
          VERSION="4.5.15"
          BASE="https://download.blender.org/release/Blender4.5"
          curl -fL --retry 3 "$BASE/blender-$VERSION-linux-x64.tar.xz" -o "$RUNNER_TEMP/blender.tar.xz"
          curl -fL --retry 3 "$BASE/blender-$VERSION.sha256" -o "$RUNNER_TEMP/blender.sha256"
          EXPECTED="$(awk '/blender-4.5.15-linux-x64.tar.xz/ {print $1; exit}' "$RUNNER_TEMP/blender.sha256")"
          ACTUAL="$(sha256sum "$RUNNER_TEMP/blender.tar.xz" | cut -d' ' -f1)"
          test -n "$EXPECTED" && test "$EXPECTED" = "$ACTUAL"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender"
          BLENDER_BIN="$RUNNER_TEMP/blender/blender-$VERSION-linux-x64/blender"
          "$BLENDER_BIN" --background --python-expr 'import bpy; print(bpy.app.version_string)'
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxrender1 libxi6 libxfixes3 libsm6 libxext6 libx11-6
          ldconfig -p | grep -q "libEGL.so.1"
          python -m pip install --disable-pip-version-check --quiet --user Pillow

      - name: Fetch contribution data and render all 3D scenes
        env:
          PROFILE_RENDER_DIR: ${{ runner.temp }}/profile-render
          PROFILE_READ_TOKEN: ${{ secrets.PROFILE_READ_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          cd repo
          python3 -m py_compile scripts/render_profile_3d.py scripts/pack_profile_3d.py scripts/fetch_contribution_data.py scripts/generate_contribution_snake.py scripts/audit_profile_assets.py
          python3 scripts/fetch_contribution_data.py
          cp assets/contribution-calendar.json assets/contribution-city-source.json
          python3 scripts/generate_contribution_snake.py
          python3 scripts/generate_metrics_city.py
          EGL_PLATFORM=surfaceless LIBGL_ALWAYS_SOFTWARE=1 "$BLENDER_BIN" --background --factory-startup --python scripts/render_profile_3d.py
          python scripts/pack_profile_3d.py
          python3 scripts/audit_profile_assets.py
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          for path in sorted(Path('assets/3d').glob('*.gif')):
              with Image.open(path) as gif:
                  assert gif.format == 'GIF' and gif.n_frames == 10 and gif.size == (900, 225), f'Invalid animation: {path}'
                  print(f'PASS {path}: {gif.size[0]}x{gif.size[1]}, {gif.n_frames} frames, {path.stat().st_size} bytes')
          calendar=json.loads(Path('assets/contribution-calendar.json').read_text(encoding='utf-8'))
          city_source=json.loads(Path('assets/contribution-city-source.json').read_text(encoding='utf-8'))
          assert city_source.get('status') in ('available','unavailable')
          if city_source['status']=='available':
              assert city_source.get('days') and city_source.get('total_contributions') is not None
          else:
              assert city_source.get('days')==[] and city_source.get('total_contributions') is None
          assert Path('assets/contribution-city-data.svg').is_file()
          snake=Path('assets/section-08-contribution-snake.gif')
          with Image.open(snake) as gif:
              assert gif.format == 'GIF' and gif.n_frames > 1
          print('PASS: approved contribution snake preserved.')
          live_snake=Path('assets/contribution-snake-live.gif')
          with Image.open(live_snake) as gif:
              assert gif.format=='GIF' and gif.size==(800,280) and gif.info.get('loop')==0
              if calendar['status']=='available':
                  assert gif.n_frames>=50 and gif.info.get('duration')==100 and live_snake.stat().st_size<3_000_000
              else:
                  assert gif.n_frames==2
          PY

      - name: Commit only self-hosted 3D renders
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd repo
          git add assets/3d/*.gif assets/contribution-calendar.json assets/contribution-city-source.json assets/contribution-city-data.svg assets/contribution-snake-live.gif assets/metrics-city.svg docs/profile-audit/asset-inventory.json docs/profile-audit/asset-inventory.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: re-render self-hosted 3D profile scenes"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort
            echo "Refusing to overwrite concurrent profile data."
            exit 1
          fi
          git push origin HEAD:main
