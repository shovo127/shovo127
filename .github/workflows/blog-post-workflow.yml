name: Update latest blog posts

on:
  schedule:
    - cron: "13 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update profile feed
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: BLOG-POST-LIST
          max_post_count: 5
          feed_list: ${{ vars.BLOG_FEED_URL }}
