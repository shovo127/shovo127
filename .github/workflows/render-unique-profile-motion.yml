name: Render unique profile motion and typography

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unique-profile-motion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Render unique motion and typewriter assets
        run: python tools/render_unique_motion.py
      - name: Commit generated assets
        run: |
          git add assets/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Render unique profile motion and animated typography"
            git push
          fi
