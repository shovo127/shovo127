name: Profile README checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check README exists
        run: test -s README.md
      - name: Validate local SVG references and workflow files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          readme = Path("README.md").read_text(encoding="utf-8")
          for start, end in [
              ("<!-- BLOG-POST-LIST:START -->", "<!-- BLOG-POST-LIST:END -->"),
          ]:
              assert readme.count(start) == 1
              assert readme.count(end) == 1
              assert readme.index(start) < readme.index(end)
          for ref in re.findall(r'(?:src|srcset)="([^"]+)"', readme):
              ref = ref.split()[0]
              if ref.startswith(("http://","https://")):
                  continue
              path = ref.lstrip("./").split("?")[0]
              assert Path(path).exists(), f"Missing README asset: {ref}"
          assert "github-readme-stats.vercel.app/api" not in readme
          assert "github-readme-activity-graph.vercel.app" not in readme
          print("README references and local assets are valid.")
          PY
      - name: Check workflow files exist
        run: |
          test -s .github/workflows/profile-dashboard.yml
          test -s .github/workflows/profile-assets.yml
          test -s .github/workflows/metrics.yml
          test -s .github/workflows/blog-post-workflow.yml
