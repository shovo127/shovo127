name: Profile README checks

on:
  workflow_run:
    workflows: ["Build self-hosted profile media"]
    types: [completed]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        run: |
          git clone --no-checkout "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            git fetch origin main
            git checkout --detach origin/main
          else
            git fetch origin "${GITHUB_SHA}"
            git checkout --detach "${GITHUB_SHA}"
          fi
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Validate self-hosted profile media and README references
        run: |
          cd repo
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re

          readme = Path("README.md").read_text(encoding="utf-8")

          class MediaParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
                  self.remote = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag not in ("img", "source"):
                      return
                  for key in ("src", "srcset"):
                      value = attrs.get(key, "").strip()
                      if not value:
                          continue
                      for candidate in value.split(","):
                          ref = candidate.strip().split()[0]
                          if ref.startswith(("http://", "https://", "//")):
                              self.remote.append(ref)
                          else:
                              self.refs.append(ref)

          parser = MediaParser()
          parser.feed(readme)

          for ref in re.findall(r"!\[[^\]]*\]\(([^)]+)\)", readme):
              ref = ref.strip().split()[0]
              if ref.startswith(("http://", "https://", "//")):
                  parser.remote.append(ref)
              else:
                  parser.refs.append(ref)

          assert not parser.remote, "External image dependencies found: " + ", ".join(parser.remote)

          missing = []
          for ref in sorted(set(parser.refs)):
              path = ref.split("#", 1)[0].split("?", 1)[0].lstrip("./")
              if not Path(path).is_file():
                  missing.append(ref)
              elif Path(path).stat().st_size == 0:
                  missing.append(ref + " (empty)")
          assert not missing, "Broken local README media: " + ", ".join(missing)

          required = [
              "assets/banner.svg",
              "assets/profile-badges.svg",
              "assets/about-portrait.svg",
              "assets/about-motion.gif",
              "assets/engineering-focus.svg",
              "assets/focus-motion.gif",
              "assets/projects-motion.gif",
              "assets/technology-stack.svg",
              "assets/technology-motion.gif",
              "assets/github-dashboard.svg",
              "assets/dashboard-motion.gif",
              "assets/profile-trophies.svg",
              "assets/achievement-motion.gif",
              "assets/contribution-city.svg",
              "assets/city-motion.gif",
              "assets/contribution-snake.gif",
              "assets/coding-rhythm.svg",
              "assets/habits-motion.gif",
              "assets/beyond-code-motion.gif",
              "assets/connect-motion.gif",
              "assets/learning-loop.svg",
              "assets/footer.svg",
              "assets/section-01.gif",
              "assets/section-02.gif",
              "assets/section-03.gif",
              "assets/section-04.gif",
              "assets/section-05.gif",
              "assets/section-06.gif",
              "assets/section-07.gif",
              "assets/section-08-contribution-snake.gif",
              "assets/section-09.gif",
              "assets/section-10.gif",
              "assets/section-11.gif",
              "assets/section-12.gif",
              "assets/github-dashboard.png",
              "assets/technology-stack.png",
              "assets/projects/kostenlos-ai.svg",
              "assets/projects/visaflowx.svg",
              "assets/projects/visaflowx-universal.svg",
              "assets/projects/noti-fixer.svg",
              "assets/projects/circle-search.svg",
              "assets/projects/iptv-shovo.svg",
          ]
          for asset in required:
              p = Path(asset)
              assert p.is_file() and p.stat().st_size > 100, f"Missing or invalid required asset: {asset}"

          for asset in required:
              p = Path(asset)
              if p.suffix == ".gif":
                  assert p.read_bytes()[:6] in (b"GIF87a", b"GIF89a"), f"Invalid GIF file: {asset}"
              if p.suffix == ".png":
                  assert p.read_bytes()[:8] == bytes([137,80,78,71,13,10,26,10]), f"Invalid PNG file: {asset}"

          import xml.etree.ElementTree as ET
          for svg in Path("assets").rglob("*.svg"):
              ET.parse(svg)

          assert "github-readme-stats.vercel.app" not in readme
          assert "github-readme-activity-graph.vercel.app" not in readme
          assert "skillicons.dev" not in readme
          assert "capsule-render.vercel.app" not in readme
          print(f"PASS: {len(set(parser.refs))} local media refs; zero external image hosts; all required assets exist.")
          PY

      - name: Validate generator and workflow files
        run: |
          cd repo
          python -m py_compile scripts/generate_profile_media.py scripts/generate_dashboard.py scripts/update_blog_feed.py scripts/check_public_leaks.py
          python scripts/check_public_leaks.py
          test -s scripts/generate_profile_media.py
          test -s scripts/check_public_leaks.py
          test -s .github/workflows/profile-assets.yml
          test -s .github/workflows/profile-dashboard.yml
          test -s scripts/generate_dashboard.py
          test -s scripts/update_blog_feed.py
          python - <<'PY'
          from pathlib import Path
          workflow_files = list(Path(".github/workflows").glob("*.yml"))
          external = []
          for path in workflow_files:
              content = path.read_text(encoding="utf-8")
              if "uses:" in content:
                  external.append(str(path))
          assert not external, "Third-party GitHub Actions are still used: " + ", ".join(external)
          print(f"PASS: {len(workflow_files)} workflows use repository-owned scripts; no third-party actions.")
          PY
