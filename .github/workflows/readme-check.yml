name: Validate profile README

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check common public-repository secret leaks
        run: python scripts/check_public_leaks.py
      - name: Test optional RSS and Atom feed updater
        run: python -m unittest discover -s tests -v
      - name: Validate README references, SVG assets and approved Hero lock
        run: python scripts/validate_profile_readme.py
