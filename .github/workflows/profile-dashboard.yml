name: Refresh profile dashboard

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_dashboard.py"
      - "scripts/generate_metrics_city.py"
      - "scripts/fetch_contribution_data.py"
      - "scripts/generate_contribution_snake.py"
      - "scripts/audit_profile_assets.py"
      - ".github/workflows/profile-dashboard.yml"
  schedule:
    - cron: "11 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-content-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository without third-party actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build self-hosted SVG dashboard from GitHub public data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_READ_TOKEN: ${{ secrets.PROFILE_READ_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          cd repo
          python -m pip install --disable-pip-version-check --quiet cairosvg
          python3 -m py_compile scripts/fetch_contribution_data.py scripts/generate_contribution_snake.py
          python scripts/fetch_contribution_data.py
          python scripts/generate_dashboard.py
          python scripts/generate_metrics_city.py
          python scripts/generate_contribution_snake.py
          python scripts/audit_profile_assets.py
          python - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              '<img src="./assets/section-08-contribution-snake.gif" width="100%" alt="Preserved multi-frame contribution calendar snake animation" />',
              '<img src="./assets/contribution-snake-live.gif" width="100%" alt="Animated snake moving through the real GitHub contribution calendar and collecting active-day markers" />'
          )
          text = text.replace(
              '<sub>Previously approved multi-frame animation, preserved byte-for-byte. It is a visual calendar animation, not a live or interactive game and is not regenerated by the workflow.</sub>',
              '<sub>The snake follows a continuous, collision-free path across the dated contribution grid. Active contribution days are food markers; the snake grows as it reaches them. This is a generated GIF visualization, not a playable game.</sub>\n\n[Preserved classic snake animation](./assets/section-08-contribution-snake.gif) · [Contribution data snapshot](./assets/contribution-calendar.json)'
          )
          p.write_text(text, encoding="utf-8")
          PY

      - name: Commit and push the generated dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd repo
          git add assets/github-dashboard.svg assets/github-dashboard.png assets/github-dashboard-data.json assets/metrics-city.svg assets/contribution-calendar.json assets/contribution-city-data.svg assets/contribution-snake-live.gif docs/profile-audit/asset-inventory.json docs/profile-audit/asset-inventory.md README.md
          if git diff --cached --quiet; then
            echo "Dashboard is already up to date."
            exit 0
          fi
          git commit -m "chore: refresh self-hosted profile dashboard"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            echo "Push race; retrying ($attempt/5)."
          done
          exit 1
