name: Verify approved contribution snake

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          git clone --depth 1 "https://github.com/${REPOSITORY}.git" repo

      - name: Install image metadata reader
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil

      - name: Verify the approved snake without replacing it
        run: |
          cd repo
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          path=Path("assets/contribution-snake.gif")
          assert path.is_file() and path.stat().st_size > 1000, "Approved contribution snake is missing."
          with Image.open(path) as gif:
              assert gif.format == "GIF" and gif.n_frames > 1, "Contribution snake is not animated."
              print(f"PASS: preserved approved snake, {gif.size[0]}x{gif.size[1]}, {gif.n_frames} frames.")
          PY
