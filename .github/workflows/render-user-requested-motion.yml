name: Render requested profile motion assets

on:
  push:
    branches:
      - fix/user-requested-motion-and-footer-cards
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requested-profile-motion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install artwork dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Render only requested motion and footer card assets
        run: python tools/render_user_requested_motion.py
      - name: Commit generated assets
        run: |
          git add assets/motion/ assets/cards/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Generate requested profile motion and footer cards"
            git push
          fi
