name: Render cyberpunk portfolio assets

on:
  push:
    branches:
      - redesign/cyberpunk-engineering-portfolio
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install fonts and renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Regenerate all portfolio artwork
        run: python tools/render_portfolio_art.py
      - name: Commit generated assets when changed
        run: |
          git add assets/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate cyberpunk portfolio assets"
            git push
          fi
