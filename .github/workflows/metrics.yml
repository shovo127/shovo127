name: Refresh legacy metrics entry point

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-content-build
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Clone this repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate local metrics dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python -m pip install --disable-pip-version-check --quiet cairosvg
          cd repo
          python scripts/generate_dashboard.py

      - name: Commit local dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd repo
          git add assets/github-dashboard.svg assets/github-dashboard.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh local GitHub metrics dashboard"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
