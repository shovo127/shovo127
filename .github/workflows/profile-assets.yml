name: Generate profile visuals

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-assets.yml"
      - "assets/contribution-city.svg"
      - "assets/contribution-snake.svg"
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  animated-artwork:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate animated engineering artwork
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          import math
          from pathlib import Path

          W,H=1100,300
          frames=[]
          for frame in range(36):
              im=Image.new("RGB",(W,H),(6,18,31))
              px=im.load()
              for y in range(H):
                  for x in range(W):
                      t=x/W
                      px[x,y]=(int(6+4*t),int(18+14*t),int(31+19*t))
              glow=Image.new("RGBA",(W,H),(0,0,0,0))
              gd=ImageDraw.Draw(glow)
              # Ambient moving light fields
              for i in range(8):
                  x=(i*157+frame*9)%W
                  y=55+(i*43)%190
                  gd.ellipse((x-48,y-48,x+48,y+48),fill=(37,211,177,28))
              glow=glow.filter(ImageFilter.GaussianBlur(28))
              im=Image.alpha_composite(im.convert("RGBA"),glow)
              d=ImageDraw.Draw(im)
              # Fine technical grid
              for x in range(30,W,44): d.line((x,0,x,H),fill=(75,139,157,25),width=1)
              for y in range(18,H,36): d.line((0,y,W,y),fill=(75,139,157,20),width=1)
              d.text((38,28),"SHOVO  /  ENGINEERING IN MOTION",fill=(106,235,207,255))
              d.text((38,65),"Curiosity → Experiments → Useful products",fill=(239,247,255,255),stroke_width=0)
              d.text((38,96),"AI  •  AUTOMATION  •  ANDROID  •  WEB",fill=(158,188,207,255))
              # Moving orbital network on right
              cx,cy=830,172
              for radius in (42,72,104):
                  d.ellipse((cx-radius,cy-radius,cx+radius,cy+radius),outline=(65,173,173,80),width=2)
              for i in range(7):
                  a=frame*0.12+i*math.tau/7
                  x=cx+104*math.cos(a); y=cy+104*math.sin(a)
                  d.line((cx,cy,x,y),fill=(66,214,183,100),width=2)
                  d.ellipse((x-7,y-7,x+7,y+7),fill=(99,244,211,255))
              d.ellipse((cx-17,cy-17,cx+17,cy+17),fill=(48,208,176,255))
              # Floating code particles
              for i in range(18):
                  x=(i*71+frame*5)%W
                  y=130+(i*29)%140
                  r=2+(i%3)
                  d.ellipse((x-r,y-r,x+r,y+r),fill=(103,185,255,180))
              # Progress beam sweeps through lower edge
              sweep=(frame*31)%W
              d.line((sweep,270,min(W,sweep+110),270),fill=(69,226,192,230),width=3)
              d.text((38,250),"BUILD WITH CURIOSITY. ENGINEER WITH CARE.",fill=(168,197,214,255))
              frames.append(im.convert("P",palette=Image.Palette.ADAPTIVE))
          Path("assets").mkdir(exist_ok=True)
          frames[0].save("assets/profile-motion.gif",save_all=True,append_images=frames[1:],duration=85,loop=0,optimize=True,disposal=2)
          print("Created 36-frame animated profile artwork.")
          PY

      - name: Commit animated artwork
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh animated profile artwork"
          file_pattern: assets/profile-motion.gif

  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

