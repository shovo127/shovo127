name: Build self-hosted realistic 3D profile media

on:
  push:
    branches: [main]
    paths:
      - "scripts/render_profile_3d.py"
      - "scripts/pack_profile_3d.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d-media
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Clone repository without third-party actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install official Blender release and GIF encoder
        run: |
          set -euo pipefail
          VERSION="4.5.15"
          BASE="https://download.blender.org/release/Blender4.5"
          curl -fL --retry 3 --retry-delay 2 "$BASE/blender-$VERSION-linux-x64.tar.xz" -o "$RUNNER_TEMP/blender.tar.xz"
          curl -fL --retry 3 --retry-delay 2 "$BASE/blender-$VERSION.sha256" -o "$RUNNER_TEMP/blender.sha256"
          EXPECTED="$(awk '/blender-4.5.15-linux-x64.tar.xz/ {print $1; exit}' "$RUNNER_TEMP/blender.sha256")"
          ACTUAL="$(sha256sum "$RUNNER_TEMP/blender.tar.xz" | cut -d' ' -f1)"
          test -n "$EXPECTED" && test "$EXPECTED" = "$ACTUAL"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender"
          BLENDER_BIN="$RUNNER_TEMP/blender/blender-$VERSION-linux-x64/blender"
          test -x "$BLENDER_BIN"
          "$BLENDER_BIN" --background --python-expr 'import bpy; print("Blender runtime:", bpy.app.version_string)'
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxrender1 libxi6 libxfixes3 libsm6 libxext6 libx11-6
          ldconfig -p | grep -q "libEGL.so.1"
          python -m pip install --disable-pip-version-check --quiet --user Pillow

      - name: Render real 3D product scenes
        env:
          PROFILE_RENDER_DIR: ${{ runner.temp }}/profile-render
        run: |
          cd repo
          python3 -m py_compile scripts/render_profile_3d.py scripts/pack_profile_3d.py
          EGL_PLATFORM=surfaceless LIBGL_ALWAYS_SOFTWARE=1 "$BLENDER_BIN" --background --factory-startup --python scripts/render_profile_3d.py
          python3 scripts/pack_profile_3d.py

      - name: Verify every rendered animation and preserve the approved snake
        run: |
          cd repo
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          expected = [
              "00-hero", "01-about", "02-engineering-focus", "03-featured-work",
              "04-technology", "05-command-center", "06-achievements",
              "07-contribution-city", "09-coding-habits", "10-learning-loop",
              "11-beyond-code", "12-connect",
          ]
          for name in expected:
              path = Path("assets/3d") / (name + ".gif")
              assert path.is_file() and path.stat().st_size > 5000, f"Missing or undersized render: {path}"
              with Image.open(path) as gif:
                  assert gif.format == "GIF" and gif.n_frames == 12, f"Invalid animation: {path}"
                  assert gif.size == (960, 240), f"Unexpected dimensions: {path} {gif.size}"
              print(f"PASS {path}: 960x240, 12 frames, {path.stat().st_size} bytes")
          snake=Path("assets/section-08-contribution-snake.gif")
          assert snake.is_file() and snake.stat().st_size > 1000, "Previously previously approved contribution snake is missing."
          print("PASS: previously approved contribution snake remains present and untouched.")
          PY

      - name: Switch README to 3D assets only after all renders pass
        run: |
          cd repo
          python3 - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          text = p.read_text(encoding="utf-8")
          replacements = {
              "./assets/banner.svg": "./assets/3d/00-hero.gif",
              "./assets/section-01.gif": "./assets/3d/01-about.gif",
              "./assets/section-02.gif": "./assets/3d/02-engineering-focus.gif",
              "./assets/section-03.gif": "./assets/3d/03-featured-work.gif",
              "./assets/section-04.gif": "./assets/3d/04-technology.gif",
              "./assets/section-05.gif": "./assets/3d/05-command-center.gif",
              "./assets/section-06.gif": "./assets/3d/06-achievements.gif",
              "./assets/section-07.gif": "./assets/3d/07-contribution-city.gif",
              "./assets/section-09.gif": "./assets/3d/09-coding-habits.gif",
              "./assets/section-10.gif": "./assets/3d/10-learning-loop.gif",
              "./assets/section-11.gif": "./assets/3d/11-beyond-code.gif",
              "./assets/section-12.gif": "./assets/3d/12-connect.gif",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Commit self-hosted 3D renders
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd repo
          git add assets/3d/*.gif README.md
          if git diff --cached --quiet; then
            echo "No rendered 3D assets changed."
            exit 0
          fi
          git commit -m "chore: render self-hosted realistic 3D profile scenes"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            echo "Push race; retrying ($attempt/5)."
          done
          exit 1
