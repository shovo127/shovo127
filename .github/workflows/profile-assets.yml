name: Build self-hosted profile media

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/generate_profile_media.py"
      - ".github/workflows/profile-assets.yml"
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-content-build
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository without third-party actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate local animated media
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python -m pip install --disable-pip-version-check --quiet Pillow numpy cairosvg
          cd repo
          python -m py_compile scripts/generate_profile_media.py
          python scripts/generate_profile_media.py
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          svg = Path("assets/github-dashboard.svg")
          if svg.is_file():
              cairosvg.svg2png(url=str(svg), write_to="assets/github-dashboard.png", output_width=1200, output_height=690)
          png = Path("assets/github-dashboard.png")
          assert png.is_file() and png.read_bytes()[:8] == bytes([137,80,78,71,13,10,26,10]), "Dashboard PNG is missing or invalid."
          print("Verified local dashboard PNG.")
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          readme = Path("README.md").read_text(encoding="utf-8")
          required = [
              "section-01.gif", "section-02.gif", "section-03.gif",
              "section-04.gif", "section-05.gif", "section-06.gif",
              "section-07.gif", "section-08-contribution-snake.gif",
              "section-09.gif", "section-10.gif", "section-11.gif", "section-12.gif",
          ]
          for name in required:
              path = Path("assets") / name
              assert path.is_file() and path.stat().st_size > 100, f"Missing generated animation: {path}"
              assert f"./assets/{name}" in readme, f"Generated animation is not referenced: {name}"
          assert not re.search(r'<(?:img|source)[^>]+(?:src|srcset)="https?://', readme, re.I), "External image dependency found."
          print("All self-hosted animated assets exist, are referenced, and README contains no remote image sources.")
          PY

      - name: Commit and push repository-owned images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd repo
          git add assets/section-*.gif assets/github-dashboard.png
          if git diff --cached --quiet; then
            echo "No generated media changes."
            exit 0
          fi
          git commit -m "chore: refresh self-hosted animated profile media"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race detected; retrying after fetching latest main (attempt $attempt)."
            sleep 3
          done
          echo "Unable to push generated assets after five retries."
          exit 1
