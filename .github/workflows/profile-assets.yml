name: Build self-hosted realistic 3D profile media

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/render_profile_3d.py"
      - ".github/workflows/profile-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d-media
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Clone repository without third-party actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install open-source 3D renderer and image encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-pil

      - name: Render real 3D product scenes
        env:
          PROFILE_RENDER_DIR: ${{ runner.temp }}/profile-render
        run: |
          cd repo
          python3 -m py_compile scripts/render_profile_3d.py scripts/pack_profile_3d.py
          blender --background --factory-startup --python scripts/render_profile_3d.py
          python3 scripts/pack_profile_3d.py

      - name: Verify every rendered animation and preserve the approved snake
        run: |
          cd repo
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          expected = [
              "00-hero", "01-about", "02-engineering-focus", "03-featured-work",
              "04-technology", "05-command-center", "06-achievements",
              "07-contribution-city", "09-coding-habits", "10-learning-loop",
              "11-beyond-code", "12-connect",
          ]
          for name in expected:
              path = Path("assets/3d") / (name + ".gif")
              assert path.is_file() and path.stat().st_size > 5000, f"Missing or undersized render: {path}"
              with Image.open(path) as gif:
                  assert gif.format == "GIF" and gif.n_frames == 24, f"Invalid animation: {path}"
                  assert gif.size == (1200, 300), f"Unexpected dimensions: {path} {gif.size}"
              print(f"PASS {path}: 1200x300, 20 frames, {path.stat().st_size} bytes")
          snake=Path("assets/contribution-snake.gif")
          assert snake.is_file() and snake.stat().st_size > 1000, "Previously approved contribution snake is missing."
          print("PASS: approved contribution snake remains present and untouched.")
          PY

      - name: Commit self-hosted 3D renders
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd repo
          git add assets/3d/*.gif
          if git diff --cached --quiet; then
            echo "No rendered 3D assets changed."
            exit 0
          fi
          git commit -m "chore: render self-hosted realistic 3D profile scenes"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            echo "Push race; retrying ($attempt/5)."
          done
          exit 1
