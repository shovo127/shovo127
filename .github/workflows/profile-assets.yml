name: Build self-hosted profile media

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/generate_profile_media.py"
      - ".github/workflows/profile-assets.yml"
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-content-build
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository without third-party actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate local animated media
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python -m pip install --disable-pip-version-check --quiet Pillow
          cd repo
          python scripts/generate_profile_media.py

      - name: Commit and push repository-owned images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd repo
          git add assets/*.gif
          if git diff --cached --quiet; then
            echo "No generated media changes."
            exit 0
          fi
          git commit -m "chore: refresh self-hosted animated profile media"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git pull --rebase origin main
          git push origin HEAD:main
