<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-labelledby="t d"><title id="t">A sustainable coding rhythm</title><desc id="d">Plan, build, test and improve, shown as a connected engineering cycle.</desc><defs><linearGradient id="b"><stop stop-color="#081626"/><stop offset="1" stop-color="#12384A"/></linearGradient><linearGradient id="l"><stop stop-color="#5EEAD4"/><stop offset="1" stop-color="#60A5FA"/></linearGradient></defs><rect width="1100" height="220" rx="24" fill="url(#b)"/><text x="40" y="42" fill="#70E8D3" font-family="Arial" font-size="13" letter-spacing="4">A REPEATABLE PROCESS</text><g font-family="Arial" text-anchor="middle"><g transform="translate(55 75)"><rect width="210" height="95" rx="16" fill="#FFFFFF" fill-opacity=".05" stroke="#5EEAD4"/><circle cx="36" cy="34" r="16" fill="#5EEAD4" fill-opacity=".2"/><text x="36" y="40" fill="#A8FFF0" font-size="18">1</text><text x="120" y="42" fill="#F4FAFF" font-size="20" font-weight="700">PLAN</text><text x="105" y="72" fill="#AFC9D9" font-size="13">Understand the problem</text></g><path d="M270 122h35m-9-7l9 7-9 7" fill="none" stroke="url(#l)" stroke-width="3"/><g transform="translate(315 75)"><rect width="210" height="95" rx="16" fill="#FFFFFF" fill-opacity=".05" stroke="#60A5FA"/><circle cx="36" cy="34" r="16" fill="#60A5FA" fill-opacity=".2"/><text x="36" y="40" fill="#B7D8FF" font-size="18">2</text><text x="120" y="42" fill="#F4FAFF" font-size="20" font-weight="700">BUILD</text><text x="105" y="72" fill="#AFC9D9" font-size="13">Make a useful solution</text></g><path d="M530 122h35m-9-7l9 7-9 7" fill="none" stroke="url(#l)" stroke-width="3"/><g transform="translate(575 75)"><rect width="210" height="95" rx="16" fill="#FFFFFF" fill-opacity=".05" stroke="#A78BFA"/><circle cx="36" cy="34" r="16" fill="#A78BFA" fill-opacity=".2"/><text x="36" y="40" fill="#D6C8FF" font-size="18">3</text><text x="120" y="42" fill="#F4FAFF" font-size="20" font-weight="700">TEST</text><text x="105" y="72" fill="#AFC9D9" font-size="13">Check edge cases</text></g><path d="M790 122h35m-9-7l9 7-9 7" fill="none" stroke="url(#l)" stroke-width="3"/><g transform="translate(835 75)"><rect width="210" height="95" rx="16" fill="#FFFFFF" fill-opacity=".05" stroke="#FBBF24"/><circle cx="36" cy="34" r="16" fill="#FBBF24" fill-opacity=".2"/><text x="36" y="40" fill="#FFE7A7" font-size="18">4</text><text x="120" y="42" fill="#F4FAFF" font-size="20" font-weight="700">IMPROVE</text><text x="105" y="72" fill="#AFC9D9" font-size="13">Learn from evidence</text></g></g></svg>