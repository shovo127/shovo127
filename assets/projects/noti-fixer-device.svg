<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="t d"><title id="t">Noti-Fixer Android diagnostic workflow</title><desc id="d">A phone connects through ADB to read-only diagnostic checks, then user-approved reversible settings changes.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#17252b"/><stop offset="1" stop-color="#26383c"/></linearGradient></defs><rect width="1120" height="300" rx="18" fill="url(#b)"/><g stroke="#9ab6ae" stroke-opacity=".17"><path d="M0 60H1120M0 240H1120M70 0V300M1050 0V300" stroke-dasharray="3 8"/></g><text x="48" y="48" fill="#a9c3b9" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">ANDROID / ADB DIAGNOSTICS / REVERSIBLE CONTROLS</text><rect x="72" y="84" width="150" height="166" rx="20" fill="#101a1e" stroke="#a5bdb3" stroke-width="2"/><rect x="86" y="105" width="122" height="119" rx="7" fill="#2a4244"/><circle cx="147" cy="236" r="5" fill="#9fb9ad"/><g fill="#e5eee7" font-family="Arial,sans-serif"><text x="147" y="145" font-size="15" text-anchor="middle" font-weight="700">Device</text><text x="147" y="168" font-size="12" text-anchor="middle">ROM + app state</text><path d="M245 165H350" stroke="#a8c2b7" stroke-width="2"/><path d="M342 159l8 6-8 6" fill="none" stroke="#a8c2b7" stroke-width="2"/><rect x="350" y="110" width="185" height="110" rx="12" fill="#203238" stroke="#8eaaa1"/><text x="442" y="151" font-size="20" text-anchor="middle" font-weight="700">ADB toolkit</text><text x="442" y="178" font-size="13" text-anchor="middle" fill="#afc2ba">Connect · inspect · report</text><path d="M535 165H630" stroke="#a8c2b7" stroke-width="2"/><path d="M622 159l8 6-8 6" fill="none" stroke="#a8c2b7" stroke-width="2"/><rect x="630" y="110" width="190" height="110" rx="12" fill="#203238" stroke="#8eaaa1"/><text x="725" y="151" font-size="20" text-anchor="middle" font-weight="700">Diagnostics</text><text x="725" y="178" font-size="13" text-anchor="mid