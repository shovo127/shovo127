<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="t d"><title id="t">VisaFlowX workflow architecture</title><desc id="d">A browser workflow diagram connecting a site profile, DOM monitor, rule engine, scheduler and user-controlled verification.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#17252b"/><stop offset="1" stop-color="#26383c"/></linearGradient><linearGradient id="a"><stop stop-color="#8fb4a9"/><stop offset="1" stop-color="#d0ddd5"/></linearGradient></defs><rect width="1120" height="300" rx="18" fill="url(#b)"/><g stroke="#9ab6ae" stroke-opacity=".17"><path d="M0 60H1120M0 240H1120M70 0V300M1050 0V300" stroke-dasharray="3 8"/></g><text x="48" y="48" fill="#a9c3b9" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">BROWSER WORKFLOW / MANIFEST V3</text><g font-family="Arial,sans-serif"><g fill="#203238" stroke="#8eaaa1"><rect x="48" y="112" width="175" height="92" rx="10"/><rect x="278" y="112" width="175" height="92" rx="10"/><rect x="508" y="112" width="175" height="92" rx="10"/><rect x="738" y="112" width="145" height="92" rx="10"/><rect x="930" y="112" width="142" height="92" rx="10"/></g><g fill="#eef2ec" font-size="18" font-weight="700"><text x="135" y="151" text-anchor="middle">Site profile</text><text x="365" y="151" text-anchor="middle">DOM monitor</text><text x="595" y="151" text-anchor="middle">Rule engine</text><text x="810" y="151" text-anchor="middle">Scheduler</text><text x="1001" y="151" text-anchor="middle">User action</text></g><g fill="#afc2ba" font-size="12"><text x="135" y="175" text-anchor="middle">Configured target</text><text x="365" y="175" text-anchor="middle">Observe changes</text><text x="595" y="175" text-anchor="middle">Evaluate conditions</text><text x="810" y="175" text-anchor="middle">Timed runs</text><text x="1001" y="175" text-anchor="middle">Verify manually</text></g></g><g fill="none" stroke="url(#a)" stroke-width="2"><pa