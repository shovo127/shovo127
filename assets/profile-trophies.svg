<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="230" viewBox="0 0 1100 230" role="img" aria-labelledby="t d"><title id="t">Developer achievement showcase</title><desc id="d">A custom visual showcase celebrating engineering, automation, learning, and open source.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#123B50"/></linearGradient><linearGradient id="g"><stop stop-color="#4DE3C1"/><stop offset="1" stop-color="#68A8FF"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter></defs><rect width="1100" height="230" rx="24" fill="url(#b)"/><g opacity=".12" stroke="#9DE9E0"><path d="M0 45H1100M0 90H1100M0 135H1100M0 180H1100M55 0V230M110 0V230M165 0V230M220 0V230M275 0V230M330 0V230M385 0V230M440 0V230M495 0V230M550 0V230M605 0V230M660 0V230M715 0V230M770 0V230M825 0V230M880 0V230M935 0V230M990 0V230M1045 0V230"/></g><text x="45" y="52" fill="#72EAD4" font-family="Arial" font-size="13" letter-spacing="4">BUILD • LEARN • SHARE</text><text x="45" y="91" fill="#F1F7FF" font-family="Arial" font-size="29" font-weight="700">Milestones are built, not collected.</text><text x="45" y="121" fill="#A9C4D7" font-family="Arial" font-size="15">A living record of curiosity, practical engineering and consistent improvement.</text><g transform="translate(60 150)"><rect width="220" height="48" rx="13" fill="#FFFFFF" fill-opacity=".07" stroke="#4DE3C1" stroke-opacity=".55"/><text x="18" y="30" fill="#DDFBF5" font-family="Arial" font-size="14">01  Open source</text></g><g transform="translate(310 150)"><rect width="220" height="48" rx="13" fill="#FFFFFF" fill-opacity=".07" stroke="#68A8FF" stroke-opacity=".55"/><text x="18" y="30" fill="#E2EEFF" font-family="Arial" font-size="14">02  Automation</text></g><g transform="translate(560 150)"><rect width="220" height="48" rx="13" fill="#FFFFFF" fill-opacity=".07" stroke="#A78BFA" stroke-opacity=".55"/><text x="18" y="30" fill="#F0E9FF" font-family="