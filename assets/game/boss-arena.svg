<text x="54" y="48" fill="#ff6b83" font-family="monospace" font-size="12" letter-spacing="3">BOSS ARENA / THE RECURRING CHALLENGE</text><text x="54" y="278" fill="#f8edf0" font-family="Arial,sans-serif" font-size="26" font-weight="700">REAL-WORLD COMPLEXITY</text><text x="54" y="303" fill="#bbaeb3" font-family="monospace" font-size="11">Break the problem down. Never fake the result.</text>
