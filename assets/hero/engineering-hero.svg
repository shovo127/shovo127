<g><circle r="78" fill="none" stroke="url(#metal)" stroke-width="3"/><circle r="57" fill="none" stroke="#ff5268" stroke-opacity=".72" stroke-width="1.5"/>
<g fill="#c8102e" fill-opacity=".65" stroke="#ff5268" stroke-opacity=".75"><path d="M-10 -96L10 -96L17 -72L-17 -72Z"/><path d="M-10 -96L10 -96L17 -72L-17 -72Z" transform="rotate(45)"/><path d="M-10 -96L10 -96L17 -72L-17 -72Z" transform="rotate(90)"/><path d="M-10 -96L10 -96L17 -72L-17 -72Z" transform="rotate(135)"/><path d="M-10 -96L10 -96L17 -72L-17 -72Z" transform="rotate(180)"/><path d="M-10 -96L10 -96L17 -72L-17 -72Z" transform="rotate(225)"/><path d="M-10 -96L10 -96L17 -72L-17 -72Z" transform="rotate(270)"/><path d="M-10 -96L10 -96L17 -72L-17 -72Z" transform="rotate(315)"/></g>
