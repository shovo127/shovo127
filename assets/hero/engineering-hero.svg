<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/></g>
<circle r="136" fill="none" stroke="#c5d7d1" stroke-width="1.5" stroke-dasharray="86 770" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="0;-856" dur="18s" repeatCount="indefinite"/></circle>
<path d="M-170 0H-130M130 0H170M0 -170V-130M0 130V170" stroke="#c8102e" stroke-opacity=".5"/></g>
<g font-family="Arial,Helvetica,sans-serif"><text x="70" y="82" fill="#ff5268" font-size="13" letter-spacing="4">ENGINEERING / SOFTWARE / SYSTEMS</text><path d="M70 108H600" stroke="#c8102e" stroke-opacity=".6"/><text x="70" y="190" fill="#f2f4ef" font-size="43" font-weight="700">Mohammed Thuhidul</text><text x="70" y="242" fill="#f2f4ef" font-size="43" font-weight="700">Islam Shovo</text><text x="72" y="292" fill="#f0d5d9" font-size="17">Engineering mindset. Practical software.</text><text x="72" y="320" fill="#f0d5d9" font-size="17">Technology built with care.</text><text x="72" y="372" fill="#c8102e" font-size="12" letter-spacing="2">DHAKA, BANGLADESH</text><text x="1130" y="385" fill="#c8102e" font-size="10" text-anchor="end" letter-spacing="2">01 / PRECISION</text></g><path d="M70 344H600" stroke="#c8102e" stroke-opacity=".25" stroke-dasharray="2 7"/>
