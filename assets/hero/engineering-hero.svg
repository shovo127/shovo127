<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Engineering mindset, software building and practical technology</title>
<desc id="desc">A dark editorial hero with the profile owner's name and a precision mechanical rotor drawing. Fine technical lines and a restrained rotating ring suggest engineering without distracting from the text.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050304"/><stop offset="1" stop-color="#140509"/></linearGradient>
<linearGradient id="metal"><stop stop-color="#ff5268"/><stop offset=".48" stop-color="#8f001a"/><stop offset="1" stop-color="#c8102e"/></linearGradient>
<radialGradient id="shade"><stop stop-color="#c8102e" stop-opacity=".18"/><stop offset="1" stop-color="#c8102e" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8f001a" stroke-opacity=".055"/></pattern>
</defs>
<rect width="1200" height="420" rx="22" fill="url(#bg)"/><rect width="1200" height="420" rx="22" fill="url(#grid)"/><circle cx="950" cy="210" r="205" fill="url(#shade)"/>
<g fill="none" stroke="#8f001a" stroke-opacity=".18"><path d="M0 350H1200M0 70H1200M700 0V420M760 32H1140M760 388H1140"/><path d="M820 24V396M1080 24V396" stroke-dasharray="2 8"/></g>
