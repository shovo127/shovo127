<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="t d"><title id="t">Contribution city</title><desc id="d">A stylized three-dimensional city made of contribution blocks. Brighter blocks represent more activity.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071521"/><stop offset="1" stop-color="#12334A"/></linearGradient><linearGradient id="top"><stop stop-color="#72F0D0"/><stop offset="1" stop-color="#2BAF9B"/></linearGradient><linearGradient id="side"><stop stop-color="#167C79"/><stop offset="1" stop-color="#0C4555"/></linearGradient><filter id="shadow"><feGaussianBlur stdDeviation="9"/></filter></defs><rect width="1100" height="360" rx="24" fill="url(#bg)"/><g opacity=".12" stroke="#6CBBC0"><path d="M0 70H1100M0 140H1100M0 210H1100M0 280H1100M100 0V360M200 0V360M300 0V360M400 0V360M500 0V360M600 0V360M700 0V360M800 0V360M900 0V360M1000 0V360"/></g><text x="42" y="48" fill="#7AEBD4" font-family="Arial" font-size="13" letter-spacing="4">YOUR CODE, YOUR CITY</text><text x="42" y="82" fill="#F1F8FF" font-family="Arial" font-size="27" font-weight="700">Every contribution builds something.</text><ellipse cx="560" cy="290" rx="420" ry="34" fill="#061019" opacity=".6" filter="url(#shadow)"/><g stroke="#1C7D78" stroke-width="1.5"><g transform="translate(185 210)"><path d="M0 0l35-20 35 20-35 20z" fill="url(#top)"/><path d="M0 0v-55l35-20v55z" fill="#147F79"/><path d="M70 0v-55L35-75v55z" fill="url(#side)"/></g><g transform="translate(265 190)"><path d="M0 0l42-24 42 24-42 24z" fill="url(#top)"/><path d="M0 0v-95l42-24v95z" fill="#168F81"/><path d="M84 0v-95l-42-24v95z" fill="url(#side)"/></g><g transform="translate(365 230)"><path d="M0 0l34-20 34 20-34 20z" fill="url(#top)"/><path d="M0 0v-75l34-20v75z" fill="#167B75"/><path d="M68 0v-75L34-95v75z" fill="url(#side)"/></g><g transform="translate(450 170)"><path d="M0 0l48-28 48 28-48 28z" fill="url(#top)"/><path d="M0 0v-115l48-28v115