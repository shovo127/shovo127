<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Engineering workflow</title><desc id="desc">Four-stage repeatable workflow: understand the problem, map the system, build a focused solution, and verify actual behaviour.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080808"/><stop offset="1" stop-color="#16080c"/></linearGradient><linearGradient id="accent"><stop stop-color="#8F001A"/><stop offset="1" stop-color="#FF304F"/></linearGradient></defs>
<rect width="1200" height="300" rx="20" fill="url(#bg)"/><g stroke="#32121A" opacity=".5"><path d="M0 75H1200M0 150H1200M0 225H1200"/></g>
<text x="48" y="43" fill="#FF5268" font-family="monospace" font-size="12" letter-spacing="3">A PRACTICAL BUILD LOOP</text>
<g stroke="url(#accent)" stroke-width="3" fill="none"><path d="M286 157H330"/><path d="M586 157H630"/><path d="M886 157H930"/></g><g fill="#FF304F"><path d="M322 149l10 8-10 8z"/><path d="M622 149l10 8-10 8z"/><path d="M922 149l10 8-10 8z"/></g>
<g font-family="Arial,sans-serif"><g><rect x="48" y="88" width="238" height="138" rx="14" fill="#101010" stroke="#6B1B2B"/><text x="72" y="121" fill="#FF5268" font-family="monospace" font-size="12">01 / UNDERSTAND</text><text x="72" y="160" fill="#F5F5F5" font-size="23" font-weight="700">Observe</text><text x="72" y="188" fill="#B5B5B5" font-size="13">Requirements, constraints</text><text x="72" y="207" fill="#B5B5B5" font-size="13">and real user behaviour</text></g><g><rect x="348" y="88" width="238" height="138" rx="14" fill="#101010" stroke="#6B1B2B"/><text x="372" y="121" fill="#FF5268" font-family="monospace" font-size="12">02 / DESIGN</text><text x="372" y="160" fill="#F5F5F5" font-size="23" font-weight="700">Model</text><text x="372" y="188" fill="#B5B5B5" font-size="13">Architecture, data flow</text><text x="372" y="207" fill="#B5B5B5" font-size="13">and failure boundaries</text></g><g><rect x="648" y="88" width="238" height="138" rx="14" fill="#101010" stroke="#6B1B2B"/><text x="672" y="121" fill="#FF5268" font-family="monospace" font-size="12">03 / IMPLEMENT</text><text x="672" y="160" fill="#F5F5F5" font-size="23" font-weight="700">Build</text><text x="672" y="188" fill="#B5B5B5" font-size="13">Small, maintainable</text><text x="672" y="207" fill="#B5B5B5" font-size="13">and documented changes</text></g><g><rect x="948" y="88" width="204" height="138" rx="14" fill="#101010" stroke="#C8102E" stroke-width="2"/><text x="972" y="121" fill="#FF5268" font-family="monospace" font-size="12">04 / VALIDATE</text><text x="972" y="160" fill="#F5F5F5" font-size="23" font-weight="700">Verify</text><text x="972" y="188" fill="#B5B5B5" font-size="13">Tests, evidence</text><text x="972" y="207" fill="#B5B5B5" font-size="13">and regression checks</text></g></g>
<path d="M1050 238 C1050 276 170 276 170 238" fill="none" stroke="#8F001A" stroke-width="2" stroke-dasharray="5 7"/><path d="M162 245l8-10 8 10" fill="none" stroke="#FF304F" stroke-width="2"/><text x="600" y="276" fill="#777777" font-family="monospace" font-size="10" text-anchor="middle" letter-spacing="2">LEARN · REFINE · REPEAT</text></svg>