<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250" role="img" aria-labelledby="t d"><title id="t">The learning loop</title><desc id="d">Curiosity leads to research, experiments, feedback and continuous improvement.</desc><defs><linearGradient id="b"><stop stop-color="#081626"/><stop offset="1" stop-color="#12384A"/></linearGradient></defs><rect width="1100" height="250" rx="24" fill="url(#b)"/><text x="40" y="42" fill="#70E8D3" font-family="Arial" font-size="13" letter-spacing="4">HOW I APPROACH NEW CHALLENGES</text><g font-family="Arial" text-anchor="middle"><g fill="#F4FAFF" font-size="18" font-weight="700"><text x="130" y="132">CURIOSITY</text><text x="340" y="132">RESEARCH</text><text x="550" y="132">EXPERIMENT</text><text x="760" y="132">FEEDBACK</text><text x="970" y="132">IMPROVEMENT</text></g><g fill="#AFC9D9" font-size="13"><text x="130" y="160">Ask better questions</text><text x="340" y="160">Find reliable evidence</text><text x="550" y="160">Build and test</text><text x="760" y="160">Measure what happened</text><text x="970" y="160">Refine the solution</text></g><g stroke-width="2.5" fill="none"><path d="M130 75v25m-7-7l7 7 7-7" stroke="#5EEAD4"/><path d="M340 75v25m-7-7l7 7 7-7" stroke="#60A5FA"/><path d="M550 75v25m-7-7l7 7 7-7" stroke="#A78BFA"/><path d="M760 75v25m-7-7l7 7 7-7" stroke="#FBBF24"/><path d="M970 75v25m-7-7l7 7 7-7" stroke="#5EEAD4"/></g><path d="M130 195C300 235 800 235 970 195" fill="none" stroke="#5EEAD4" stroke-opacity=".5" stroke-width="2" stroke-dasharray="7 8"/><path d="M950 193l20 2-8 18" fill="none" stroke="#5EEAD4" stroke-width="2"/></g></svg>